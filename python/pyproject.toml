cxnfs-trainer-surface-check = "cxnfs.torch_dataset:main_trainer_surface_check"
cxnfs-trainer-surface-matrix = "cxnfs.torch_dataset:main_trainer_surface_matrix"
cxnfs-trainer-contract-benchmark = "cxnfs.torch_dataset:main_trainer_contract_benchmark"
cxnfs-trainer-stream-smoke = "cxnfs.torch_dataset:main_trainer_stream_smoke"
cxnfs-trainer-stream-benchmark = "cxnfs.torch_dataset:main_trainer_stream_smoke"
cxnfs-trainer-workload-benchmark = "cxnfs.torch_dataset:main_trainer_workload_benchmark"
cxnfs-workload-evidence = "cxnfs.workload_evidence:main"
cxnfs-workload-decision = "cxnfs.workload_decision:main"
cxnfs-benchmark = "cxnfs.benchmark:main"
